<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Classification for the Blind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            margin-top: 50px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .stream-container {
            margin-top: 30px;
        }

        .stream-img {
            max-height: 500px;
            object-fit: cover;
            border: 2px solid #007bff;
            border-radius: 8px;
        }

        footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">ICB | Image Classification for the Blind</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title text-center">Enter Your Stream URL</h2>
                        <form method="POST" class="mt-4">
                            <div class="mb-3">
                                <label for="video_url" class="form-label">IP Webcam URL:</label>
                                <input type="text" class="form-control" id="video_url" value="http://192.168.40.131:8080/video" name="video_url" placeholder="http://192.168.x.x:8080/video" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Start Stream</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        {% if video_url %}
        <div class="row justify-content-center stream-container">
            <div class="col-md-10">
                <h3 class="text-center">Live Stream</h3>
                <div class="d-flex justify-content-center">
                    <img src="{{ url_for('video_feed') }}" alt="Video Stream" class="img-fluid stream-img">
                </div>
            </div>
        </div>
        {% endif %}
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2024 ECE Advanced Machine Learning Group 5. All Rights Reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
